
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AutoCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="signup-page">

        <!-- Brand -->
        <div class="signup-header">
            <a href="index.html">Auto<span>Care</span></a>
            <p>VEHICLE SERVICE MANAGEMENT</p>
        </div>

        <!-- Signup Card -->
        <div class="signup-card">

            <div class="signup-heading">
                <span class="signup-icon">🚗</span>
                <h2>Create Your Account</h2>
                <p>Get started with AutoCare today!</p>
            </div>

            <form>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter your full name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control"
                               placeholder="Enter phone number" required>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="Enter your email" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control"
                               placeholder="Create password" required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control"
                               placeholder="Confirm password" required>
                    </div>

                </div>

                <button type="submit" class="btn signup-btn w-100">
                    Create Account →
                </button>
            </form>

            <div class="signup-bottom">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

                <a href="index.html" class="signup-home">
                    ← Back to Home
                </a>
            </div>

        </div>

        <p class="signup-copyright">
            © 2026 AutoCare. All Rights Reserved.
        </p>

    </div>

</body>
</html>
